# Render Blueprint: New + > Blueprint > pick this repo. Creates the web service and a Postgres database.
services:
  - type: web
    name: healthcare-portal
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DB_SSL
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-db
          property: connectionString

databases:
  - name: healthcare-db
    plan: free
    region: singapore
    databaseName: healthcare
